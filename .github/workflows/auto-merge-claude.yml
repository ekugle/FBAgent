name: Auto-merge Claude branch to main

on:
  push:
    branches:
      - 'claude/**'

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Claude branch into Main
        run: |
          git fetch origin Main
          git checkout Main
          git merge --ff-only origin/${{ github.ref_name }} || \
          git merge -X theirs origin/${{ github.ref_name }} -m "Auto-merge ${{ github.ref_name }} into Main"
          git push origin Main

      - name: Delete Claude branch after merge
        run: git push origin --delete ${{ github.ref_name }}
